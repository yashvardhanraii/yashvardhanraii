<svg width="760" height="190" viewBox="0 0 760 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 20px;
      fill: #FCA5A5;
    }

    .line1 {
      animation: show1 6s steps(32) forwards;
      clip-path: inset(0 100% 0 0);
    }

    .line2 {
      animation: show2 6s steps(36) forwards;
      animation-delay: 1.9s;
      clip-path: inset(0 100% 0 0);
    }

    .line3 {
      animation: show3 6s steps(31) forwards;
      animation-delay: 4.1s;
      clip-path: inset(0 100% 0 0);
    }

    .cursor {
      animation: blink 0.8s infinite;
      fill: #FCA5A5;
    }

    @keyframes show1 {
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes show2 {
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes show3 {
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <rect x="10" y="10" width="740" height="170" rx="18" fill="#111111" stroke="#DC2626" stroke-width="3"/>

  <circle cx="38" cy="38" r="6" fill="#DC2626"/>
  <circle cx="60" cy="38" r="6" fill="#991B1B"/>
  <circle cx="82" cy="38" r="6" fill="#FCA5A5"/>

  <text x="55" y="86" class="text line1">Raised in a business environment</text>
  <text x="55" y="121" class="text line2">Learned early how decisions get made</text>
  <text x="55" y="156" class="text line3">Chose data to make them better</text>

  <text x="405" y="156" class="text cursor">|</text>
</svg>
