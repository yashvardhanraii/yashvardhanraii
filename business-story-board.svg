<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 20px;
      fill: #FCA5A5;
    }

    .line1, .line2, .line3 {
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .line1 {
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 0.6s;
    }

    .line2 {
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 2.2s;
    }

    .line3 {
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 3.8s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <rect x="10" y="10" width="740" height="180" rx="18" fill="#111111" stroke="#DC2626" stroke-width="3"/>

  <circle cx="38" cy="38" r="6" fill="#DC2626"/>
  <circle cx="60" cy="38" r="6" fill="#991B1B"/>
  <circle cx="82" cy="38" r="6" fill="#FCA5A5"/>

  <text x="55" y="88" class="text line1">Raised in a business environment</text>
  <text x="55" y="126" class="text line2">Learned early how decisions get made</text>
  <text x="55" y="164" class="text line3">Chose data to make them better</text>
</svg>
