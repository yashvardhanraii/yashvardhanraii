<svg width="760" height="190" viewBox="0 0 760 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 20px;
      fill: #FCA5A5;
    }

    .line1, .line2, .line3 {
      clip-path: inset(0 100% 0 0);
      animation-fill-mode: forwards;
      animation-timing-function: steps(40);
    }

    .line1 { animation: type1 1.8s forwards; }
    .line2 { animation: type2 2s 2s forwards; }
    .line3 { animation: type3 1.8s 4.4s forwards; }

    .cursor {
      animation: blink 0.8s infinite, hideCursor 0.1s 6.4s forwards;
      fill: #FCA5A5;
    }

    @keyframes type1 { to { clip-path: inset(0 0 0 0); } }
    @keyframes type2 { to { clip-path: inset(0 0 0 0); } }
    @keyframes type3 { to { clip-path: inset(0 0 0 0); } }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes hideCursor {
      to { opacity: 0; }
    }
  </style>

  <rect x="10" y="10" width="740" height="170" rx="18" fill="#111111" stroke="#DC2626" stroke-width="3"/>

  <circle cx="38" cy="38" r="6" fill="#DC2626"/>
  <circle cx="60" cy="38" r="6" fill="#991B1B"/>
  <circle cx="82" cy="38" r="6" fill="#FCA5A5"/>

  <text x="55" y="86" class="text line1">Raised in a business environment</text>
  <text x="55" y="121" class="text line2">Learned early how decisions get made</text>
  <text x="55" y="156" class="text line3">Chose data to make them better</text>

  <text x="415" y="156" class="text cursor">|</text>
</svg>
